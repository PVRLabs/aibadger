name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform_smoke:
        description: Run only the short Windows/Linux CLI smoke
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.platform_smoke }}
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit and Git integration tests
        env:
          BADGER_INTEGRATION: "1"
        run: go test ./...

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: CLI smoke tests
        run: BADGER_CLI_SMOKE=1 go test ./tests/cli -run '^TestCLISmoke$' -count=1

  platform-smoke:
    name: CLI smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        id: build-cli
        run: go build -o bin/badger.exe ./cmd/badger

      - name: Version, help, and quick map smoke
        env:
          BADGER_PLATFORM_SMOKE_BIN: ${{ github.workspace }}/bin/badger.exe
        run: go test ./tests/cli -run '^TestCLIPlatformSmoke$' -count=1 -timeout=90s -v

      - name: Native Windows Unicode clipboard
        if: runner.os == 'Windows'
        run: go test ./internal/clipboard -count=1 -timeout=30s -v

      - name: Native Windows replacement
        if: runner.os == 'Windows'
        run: go test ./internal/codemap -run '^TestWindowsNativeReplacementSucceeds$' -count=1 -timeout=30s -v

      - name: FILE formatting compatibility and native path resolution
        run: go test ./internal/extractor -run '^TestFileMarkdown' -count=1 -timeout=30s -v

      - name: Native Windows diagnose batch probes
        if: runner.os == 'Windows'
        env:
          BADGER_WINDOWS_INSTALLED_TOOLS: "1"
        run: go test ./internal/diagnose -count=1 -timeout=30s

      - name: Windows installer file-operation unit tests (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/windows-installer-unit.ps1

      - name: Windows installer file-operation unit tests (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-installer-unit.ps1

      - name: Windows Explorer command-line unit tests
        if: runner.os == 'Windows'
        run: go test ./internal/tui -run '^TestExplorerReveal' -count=1 -timeout=30s

      - name: Windows diagnose, API, Unicode, and path smoke (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/windows-smoke.ps1 -BinaryPath ./bin/badger.exe

      - name: Windows diagnose, API, Unicode, and path smoke (PowerShell 7)
        if: ${{ runner.os == 'Windows' && !cancelled() && steps.build-cli.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -BinaryPath ./bin/badger.exe
