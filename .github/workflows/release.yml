name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version (for example, v0.5.5)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: validate release preparation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release inputs and repository state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -eu

          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "release must be dispatched from main (got $DISPATCH_REF)" >&2
            exit 1
          fi

          if ! printf '%s\n' "$RELEASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version must match vX.Y.Z: $RELEASE_VERSION" >&2
            exit 1
          fi

          source_version="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/version/version.go)"
          if [ "$source_version" != "$RELEASE_VERSION" ]; then
            echo "internal/version/version.go is $source_version, expected $RELEASE_VERSION" >&2
            exit 1
          fi

          if ! awk -v tag="$RELEASE_VERSION" '
            $0 == "## [" tag "]" || index($0, "## [" tag "] - ") == 1 { found = 1 }
            END { exit !found }
          ' CHANGELOG.md; then
            echo "CHANGELOG.md has no heading for $RELEASE_VERSION" >&2
            exit 1
          fi

          if git show-ref --tags --verify --quiet "refs/tags/$RELEASE_VERSION" || \
             git ls-remote --exit-code origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "tag already exists: $RELEASE_VERSION" >&2
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $RELEASE_VERSION" >&2
            exit 1
          fi

          echo "validated $RELEASE_VERSION at $(git rev-parse HEAD)"

  tag:
    name: tag release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          git tag "$RELEASE_VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_VERSION"

  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archive
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -eu

          mkdir -p dist

          if [ "$GOOS" = "windows" ]; then
            binary_name="badger.exe"
            archive_ext=".zip"
          else
            binary_name="badger"
            archive_ext=".tar.gz"
          fi

          out_dir="dist/badger_${GOOS}_${GOARCH}"
          archive_name="badger_${RELEASE_TAG#v}_${GOOS}_${GOARCH}${archive_ext}"

          mkdir -p "${out_dir}"
          go build -trimpath -tags aibadger_release -ldflags="-s -w" -o "${out_dir}/${binary_name}" ./cmd/badger

          if [ "$GOOS" = "windows" ]; then
            zip -j "dist/${archive_name}" "${out_dir}/${binary_name}"
          else
            tar -czf "dist/${archive_name}" -C "${out_dir}" "${binary_name}"
          fi
          (cd dist && sha256sum "${archive_name}" > "${archive_name}.sha256")

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.version }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        id: notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          bash scripts/generate-release-notes.sh "$RELEASE_VERSION" > release-notes.md
          echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.tar.gz.sha256
            release-assets/*.zip
            release-assets/*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -eu

          assets="$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          expected="$(printf '%s\n' \
            "badger_${RELEASE_VERSION#v}_darwin_amd64.tar.gz" \
            "badger_${RELEASE_VERSION#v}_darwin_amd64.tar.gz.sha256" \
            "badger_${RELEASE_VERSION#v}_darwin_arm64.tar.gz" \
            "badger_${RELEASE_VERSION#v}_darwin_arm64.tar.gz.sha256" \
            "badger_${RELEASE_VERSION#v}_linux_amd64.tar.gz" \
            "badger_${RELEASE_VERSION#v}_linux_amd64.tar.gz.sha256" \
            "badger_${RELEASE_VERSION#v}_linux_arm64.tar.gz" \
            "badger_${RELEASE_VERSION#v}_linux_arm64.tar.gz.sha256" \
            "badger_${RELEASE_VERSION#v}_windows_amd64.zip" \
            "badger_${RELEASE_VERSION#v}_windows_amd64.zip.sha256")"

          if [ "$(printf '%s\n' "$assets" | sed '/^$/d' | wc -l | tr -d ' ')" -ne 10 ]; then
            echo "expected 10 release assets, got:" >&2
            printf '%s\n' "$assets" >&2
            exit 1
          fi

          while IFS= read -r asset; do
            if ! printf '%s\n' "$assets" | grep -Fqx "$asset"; then
              echo "missing release asset: $asset" >&2
              exit 1
            fi
          done <<EOF
          $expected
          EOF

          echo "verified release $RELEASE_VERSION with ten expected assets"
