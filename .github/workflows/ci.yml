name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform_smoke:
        description: Run only the short Windows/Linux CLI smoke
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.platform_smoke }}
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit and Git integration tests
        env:
          BADGER_INTEGRATION: "1"
        run: go test ./...

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: CLI smoke tests
        run: BADGER_CLI_SMOKE=1 go test ./tests/cli -run '^TestCLISmoke$' -count=1

  platform-smoke:
    name: CLI smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        run: go build -o bin/badger.exe ./cmd/badger

      - name: Version, help, and quick map smoke
        env:
          BADGER_PLATFORM_SMOKE_BIN: ${{ github.workspace }}/bin/badger.exe
        run: go test ./tests/cli -run '^TestCLIPlatformSmoke$' -count=1 -timeout=90s -v

      - name: Native Windows replacement
        if: runner.os == 'Windows'
        run: go test ./internal/codemap -run '^TestWindowsNativeReplacementSucceeds$' -count=1 -timeout=30s -v
