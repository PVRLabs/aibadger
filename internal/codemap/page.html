<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Badger · Codebase Map</title>
<style>
:root {
  color-scheme:dark;
  --font-ui: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-heading: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-code: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --bg:#101413; --panel:#191e1c; --text:#edf2ee; --muted:#a6b3ac;
  --line:#303a35; --accent:#83d69a; --soft:#23372b; --input:#141916;
  --map:#111714; --tile-border:#111714; --tile-light:32%;
  --direct:#35483f; --direct-stripe:#3b4e45; --selection:#83e497;
  --button:#64c879; --button-text:#0c2011; --button-hover:#7bda8e;
  --language-light:64%;
  --shadow:#00000040; --tooltip:#222c25;
}
:root[data-theme="light"] {
  color-scheme:light;
  --bg:#f5f6f8; --panel:#fff; --text:#202b3b; --muted:#687587;
  --line:#e3e7ed; --accent:#226955; --soft:#edf5f1; --input:#f8f9fb;
  --map:#edf0f3; --tile-border:#fff; --tile-light:37%;
  --direct:#52675b; --direct-stripe:#586d61; --selection:#b8ffcc;
  --button:#286b57; --button-text:#fff; --button-hover:#1e5545;
  --language-light:43%;
  --shadow:#202b3b18; --tooltip:#202b3b;
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { background:var(--bg); color:var(--text); font:14px/1.5 var(--font-ui); -webkit-font-smoothing:antialiased; }
button,input,select { font:inherit; }
h1,h2,.brand { font-family:var(--font-heading); font-weight:650; }
::selection { background:var(--accent); color:var(--bg); }
#search::placeholder { color:var(--muted); opacity:1; }
.folder-path,.file-name,.child-name,.crumb { font-family:var(--font-code); }
.summary strong,.tile-lines,#repository-stats { font-variant-numeric:tabular-nums; }
.control,.focus-button,.crumb,.search-result,.child-row { transition:background-color 120ms ease,color 120ms ease,border-color 120ms ease; }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; } }
button { cursor:pointer; }
button:disabled { opacity:.4; cursor:default; }
button:focus-visible,input:focus-visible,select:focus-visible,.tile:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
header { padding:18px 28px; display:flex; align-items:center; justify-content:space-between; gap:24px; background:var(--panel); border-bottom:1px solid var(--line); }
.brand { color:var(--accent); font-size:20px; font-weight:700; letter-spacing:-.65px; }
.brand-line { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; }
.feature-name { padding-left:16px; border-left:1px solid var(--line); font-size:14px; font-weight:550; color:var(--text); }
.page-footer { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 20px; padding:16px 2px 0; font-size:11px; color:var(--muted); }
.footer-brand { color:var(--accent); }
.subtitle { color:var(--muted); font-size:12px; margin-top:4px; }
.header-actions { display:flex; align-items:center; gap:12px; }
#theme-toggle { padding:9px 12px; }
.search { position:relative; width:min(360px,40vw); }
#search { width:100%; border:1px solid var(--line); border-radius:9px; padding:10px 14px; background:var(--input); color:var(--text); }
#search-results { position:absolute; top:48px; left:0; right:0; z-index:200; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 36px var(--shadow); max-height:320px; overflow:auto; }
#search-results:empty { display:none; }
.search-result { color:var(--text); display:block; width:100%; text-align:left; padding:10px 14px; border:0; background:var(--panel); overflow-wrap:anywhere; }
.search-result:hover { background:var(--soft); }
.search-result small { display:block; color:var(--muted); }
.workspace { padding:22px 28px 26px; }
.toolbar { display:flex; align-items:center; gap:8px; padding:12px 14px; background:var(--panel); border:1px solid var(--line); border-radius:12px 12px 0 0; }
.control { font-size:12px; font-weight:550; border:1px solid var(--line); border-radius:7px; padding:6px 10px; color:var(--text); background:var(--panel); white-space:nowrap; }
.control:hover:enabled { background:var(--soft); }
#crumbs { display:flex; align-items:center; gap:4px; flex:1; min-width:0; overflow:auto; }
.crumb { font-size:12px; border:0; border-radius:5px; padding:5px 7px; color:var(--muted); background:transparent; white-space:nowrap; }
.crumb:hover,.crumb:last-child { color:var(--accent); background:var(--soft); }
.sep { color:var(--muted); }
#repository-stats { flex:0 1 auto; min-width:0; max-width:100%; color:var(--muted); white-space:normal; overflow-wrap:anywhere; margin-left:12px; padding-left:20px; border-left:1px solid var(--line); text-align:right; }
.repository-loc { display:block; color:var(--accent); line-height:1.15; }
.repository-loc strong { font-family:var(--font-heading); font-size:28px; font-weight:700; letter-spacing:-.8px; }
.repository-loc .loc-unit { font-size:12px; font-weight:650; letter-spacing:.06em; margin-left:5px; }
.repository-counts { display:block; margin-top:4px; font-size:11px; }
.depth-label { color:var(--muted); font-size:12px; white-space:nowrap; }
main { display:grid; grid-template-columns:minmax(0,1fr) 310px; background:var(--panel); border:1px solid var(--line); border-top:0; border-radius:0 0 12px 12px; overflow:hidden; }
#map-wrap { min-width:0; padding:14px; display:flex; flex-direction:column; }
#map { position:relative; width:100%; height:max(440px,calc(100vh - 330px)); overflow:hidden; background:var(--map); border-radius:8px; }
.leaf-view { height:100%; display:grid; justify-items:center; align-items:safe center; padding:28px; background:linear-gradient(145deg,var(--soft),var(--map)); overflow:auto; }
.file-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); font-size:12px; }
.file-name { font-size:11px; line-height:1.7; overflow-wrap:anywhere; }
.file-count { color:var(--muted); font-size:11px; margin:10px 0; }
.file-list .control { margin:4px 0; }
.leaf-card { width:min(100%,440px); padding:28px; border:1px solid var(--line); border-radius:14px; background:var(--panel); box-shadow:0 8px 30px var(--shadow); }
.leaf-card h2 { margin:8px 0; font-size:28px; letter-spacing:-.7px; overflow-wrap:anywhere; }
.leaf-card p { color:var(--muted); font-size:13px; }
.leaf-card .control { margin-top:8px; }
.map-caption { display:flex; flex-wrap:wrap; gap:8px 20px; color:var(--muted); font-size:11px; padding:12px 2px 0; }
.map-caption[hidden] { display:none; }
.map-caption span:first-child { margin-right:auto; }
.tile { position:absolute; overflow:hidden; border:2px solid var(--tile-border); border-radius:4px; cursor:pointer; color:white; background:hsl(var(--tile-hue) 24% calc(var(--tile-light) - var(--tile-depth))); transition:filter 100ms ease; }
.tile:hover { filter:brightness(1.12); }
.tile:focus-visible { outline:3px solid var(--selection); outline-offset:-3px; }
.tile.depth-0 { border-radius:6px; }
.tile.parent > .tile-label { background:#00000016; }
.tile.selected { outline:3px solid var(--selection); outline-offset:-3px; }
.tile.direct { cursor:pointer; background:repeating-linear-gradient(135deg,var(--direct),var(--direct) 8px,var(--direct-stripe) 8px,var(--direct-stripe) 9px) !important; }
.tile-label { position:absolute; top:0; left:0; right:0; padding:6px 9px; pointer-events:none; overflow:hidden; }
.tile-name { display:block; font-family:var(--font-code); font-size:13px; line-height:18px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile-languages { display:flex; align-items:center; gap:4px; margin-top:3px; overflow:hidden; white-space:nowrap; }
.language-chip { display:block; min-width:0; padding:1px 5px; border-radius:4px; font-size:10px; line-height:16px; color:#f5f7f6; background:transparent; border:1px solid hsl(var(--language-hue) var(--language-saturation) 72% / .45); overflow:hidden; text-overflow:ellipsis; }
.language-more { flex-shrink:0; font-size:10px; line-height:18px; color:#ffffffcf; }
.tile-lines { display:block; color:#ffffffdf; font-size:11px; line-height:15px; }
.tile.tiny .tile-label { display:none; }
#details { min-width:0; padding:22px; border-left:1px solid var(--line); max-height:max(490px,calc(100vh - 290px)); overflow:auto; }
.eyebrow { color:var(--muted); font-size:10px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; }
#details h2 { margin:7px 0 4px; font-size:22px; letter-spacing:-.6px; overflow-wrap:anywhere; }
.folder-path { font-size:11px; color:var(--muted); overflow-wrap:anywhere; margin-bottom:18px; }
.summary { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
.summary div { border:0; border-radius:6px; padding:12px 0; background:transparent; color:var(--muted); font-size:11px; }
.summary strong { display:block; color:var(--text); font-size:24px; font-weight:600; letter-spacing:-.7px; }
.share { font-size:12px; color:var(--muted); margin:0 0 16px; }
.focus-button { width:100%; border:0; border-radius:8px; padding:10px; background:var(--button); color:var(--button-text); font-weight:600; }
.focus-button:hover:enabled { background:var(--button-hover); }
.section-title { margin:26px 0 10px; font-size:12px; font-weight:700; }
.stat-row { padding:8px 0; }
.stat-heading { display:flex; justify-content:space-between; gap:10px; font-size:12px; }
.stat-value,.child-value { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
.bar { height:4px; background:var(--map); border-radius:4px; margin-top:7px; overflow:hidden; }
.bar span { display:block; height:100%; background:hsl(var(--language-hue, 160) var(--language-saturation, 0%) var(--language-light)); border-radius:4px; }
.child-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; width:100%; text-align:left; padding:10px 0; border:0; border-top:1px solid var(--line); background:transparent; color:var(--text); font-size:12px; }
.child-row:hover { color:var(--accent); background:var(--soft); }
.child-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.substat { display:block; color:var(--muted); font-size:11px; font-weight:400; }
#tooltip { position:fixed; z-index:100; display:none; max-width:320px; padding:10px 13px; border-radius:8px; color:white; background:var(--tooltip); box-shadow:0 5px 20px var(--shadow); pointer-events:none; font-size:12px; overflow-wrap:anywhere; }
.empty { padding:12px; color:var(--muted); font-size:12px; }
@media(max-width:1100px) { .toolbar { flex-wrap:wrap; } #repository-stats { order:3; flex-basis:100%; margin:4px 0 0; padding:12px 0 0; border-left:0; border-top:1px solid var(--line); text-align:left; } }
@media(max-width:900px) { header { padding:16px; } .workspace { padding:16px; } main { grid-template-columns:minmax(0,1fr) 270px; } .depth-label { display:none; } }
@media(max-width:680px) { header { align-items:stretch; flex-direction:column; gap:12px; } .header-actions { gap:8px; } .search { width:auto; flex:1; min-width:0; } .toolbar { flex-wrap:wrap; } #crumbs { order:2; flex-basis:100%; } main { grid-template-columns:1fr; } #map { height:55vh; min-height:320px; } #details { border-left:0; border-top:1px solid var(--line); max-height:none; } }
</style>
</head>
<body>
<header>
  <div><div class="brand-line"><div class="brand">AI Badger</div><div class="feature-name">Codebase Map</div></div><div class="subtitle">A closer look at where your code lives.</div></div>
  <div class="header-actions"><div class="search"><input id="search" type="search" placeholder="Find a folder…" aria-label="Find a folder" autocomplete="off" aria-controls="search-results"><div id="search-results" aria-label="Matching folders"></div></div><button id="theme-toggle" class="control" type="button" aria-label="Switch to light mode">☀ Light mode</button></div>
</header>
<div class="workspace">
  <div class="toolbar">
    <button id="up" class="control" title="Go to parent folder">↑ Up</button>
    <button id="reset" class="control" title="Return to the repository root">Repository</button>
    <nav id="crumbs" aria-label="Focused directory"></nav>
    <label class="depth-label" for="depth">Visible levels</label><select id="depth" class="control" aria-label="Visible levels"><option value="1">One level</option><option value="2" selected>Two levels</option><option value="4">Four levels</option></select>
    <div id="repository-stats" aria-label="Repository totals"></div>
  </div>
  <main>
    <section id="map-wrap"><div id="map" aria-label="Directory treemap"></div><div class="map-caption"><span id="area-caption">Area = nonblank lines, including comments · Color = folder group</span><span>Click to inspect · Double-click to explore</span></div></section>
    <aside id="details" aria-label="Folder details"></aside>
  </main>
  <footer class="page-footer"><span class="footer-brand">AI Badger · Codebase Map</span><span>Generated locally · Nothing uploaded</span></footer>
</div>
<div id="tooltip"></div>
<script id="map-data" type="application/json">__BADGER_MAP_DATA__</script>
<script>
(() => {
  "use strict";
  const themeToggle = document.getElementById("theme-toggle");
  themeToggle.addEventListener("click", () => {
    const isDark = document.documentElement.dataset.theme === "dark";
    document.documentElement.dataset.theme = isDark ? "light" : "dark";
    themeToggle.textContent = isDark ? "☾ Dark mode" : "☀ Light mode";
    themeToggle.setAttribute("aria-label", isDark ? "Switch to dark mode" : "Switch to light mode");
  });
  const root = JSON.parse(document.getElementById("map-data").textContent);
  const map = document.getElementById("map");
  const details = document.getElementById("details");
  const crumbs = document.getElementById("crumbs");
  const tooltip = document.getElementById("tooltip");
  const byPath = new Map();
  const parents = new Map();
  const visibleTiles = new Map();
  let focus = root;
  let selected = root;
  let resizeTimer;

  function index(node, parent) {
    byPath.set(node.path, node);
    if (parent) parents.set(node.path, parent);
    node.children.forEach(child => index(child, node));
  }
  index(root, null);

  function formatNumber(value) { return new Intl.NumberFormat().format(value); }
  function compactLOC(value) {
    return new Intl.NumberFormat("en", {notation: "compact", maximumFractionDigits: 1}).format(value);
  }
  function compact(value) {
    if (value >= 1000000) return (value / 1000000).toFixed(value >= 10000000 ? 0 : 1).replace(/\.0$/, "") + "m";
    if (value >= 1000) return (value / 1000).toFixed(value >= 10000 ? 0 : 1).replace(/\.0$/, "") + "k";
    return String(value);
  }
  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
  }
  function hueFor(value) {
    let hash = 0;
    for (let i = 0; i < value.length; i++) hash = ((hash << 5) - hash + value.charCodeAt(i)) | 0;
    return [158, 204, 230, 270, 24, 185][Math.abs(hash) % 6];
  }

  // Anchor colors to repository branches so drilling down preserves identity.
  function branchHue(node) {
    let branch = node;
    while (parents.has(branch.path) && parents.get(branch.path) !== root) {
      branch = parents.get(branch.path);
    }
    const index = root.children.indexOf(branch);
    return index < 0 ? hueFor(node.path) : [158, 204, 270, 24, 185, 230][index % 6];
  }

  function directLanguages(node) {
    return node.directLanguages || {};
  }
  function languageNames(node) {
    return Object.entries(node.languages || {}).filter(([, stat]) => stat.lines > 0)
      .sort((a, b) => b[1].lines - a[1].lines || a[0].localeCompare(b[0])).map(([name]) => name);
  }
  function showTileLanguages(node, box) {
    return box.w >= 140 && box.h >= 76 && languageNames(node).length > 0;
  }
  function childItems(node) {
    const items = node.children.map(child => ({node: child, value: child.lines, direct: false}));
    if (node.directLines > 0) {
      items.push({
        node: {name: "Files in this folder", path: node.path + "::direct", lines: node.directLines, files: node.directFiles, owner: node, languages: directLanguages(node)},
        value: node.directLines,
        direct: true
      });
    }
    return items.filter(item => item.value > 0).sort((a, b) => b.value - a.value);
  }

  function worst(row, side) {
    if (!row.length) return Infinity;
    const sum = row.reduce((total, item) => total + item.area, 0);
    const max = Math.max(...row.map(item => item.area));
    const min = Math.min(...row.map(item => item.area));
    return Math.max((side * side * max) / (sum * sum), (sum * sum) / (side * side * min));
  }

  function squarify(items, box) {
    if (!items.length || box.w <= 0 || box.h <= 0) return [];
    const total = items.reduce((sum, item) => sum + item.value, 0);
    const scaled = items.map(item => ({...item, area: item.value / total * box.w * box.h}));
    const result = [];
    let remaining = scaled.slice();
    let x = box.x, y = box.y, w = box.w, h = box.h;

    while (remaining.length) {
      let row = [];
      const side = Math.min(w, h);
      while (remaining.length) {
        const candidate = row.concat(remaining[0]);
        if (row.length && worst(candidate, side) > worst(row, side)) break;
        row = candidate;
        remaining.shift();
      }
      const area = row.reduce((sum, item) => sum + item.area, 0);
      if (w >= h) {
        const rowWidth = h ? area / h : 0;
        let rowY = y;
        row.forEach(item => {
          const itemHeight = rowWidth ? item.area / rowWidth : 0;
          result.push({...item, box: {x, y: rowY, w: rowWidth, h: itemHeight}});
          rowY += itemHeight;
        });
        x += rowWidth;
        w -= rowWidth;
      } else {
        const rowHeight = w ? area / w : 0;
        let rowX = x;
        row.forEach(item => {
          const itemWidth = rowHeight ? item.area / rowHeight : 0;
          result.push({...item, box: {x: rowX, y, w: itemWidth, h: rowHeight}});
          rowX += itemWidth;
        });
        y += rowHeight;
        h -= rowHeight;
      }
    }
    return result;
  }

  function tileKey(node) {
    return JSON.stringify([node.owner ? node.owner.path : node.path, Boolean(node.owner)]);
  }
  function makeTile(item, box, depth, hue) {
    const tile = document.createElement("div");
    tile.className = "tile depth-" + depth + (item.direct ? " direct" : "");
    if (tileKey(selected) === tileKey(item.node)) tile.classList.add("selected");
    if (box.w < 64 || box.h < 30) tile.classList.add("tiny");
    tile.style.left = box.x + "px";
    tile.style.top = box.y + "px";
    tile.style.width = Math.max(0, box.w) + "px";
    tile.style.height = Math.max(0, box.h) + "px";
    if (!item.direct) {
      tile.style.setProperty("--tile-hue", hue);
      tile.style.setProperty("--tile-depth", Math.min(9, depth * 3) + "%");
    }
    if (box.w >= 64 && box.h >= 30) {
      tile.innerHTML = '<div class="tile-label"><span class="tile-name">' + escapeHTML(item.node.name) + '</span>' + (box.w >= 90 && box.h >= 48 ? '<span class="tile-lines">' + compact(item.node.lines) + ' lines</span>' : '') + (showTileLanguages(item.node, box) ? languageChips(item.node) : '') + '</div>';
    }
    tile.addEventListener("mousemove", event => showTooltip(event, item.node));
    tile.addEventListener("mouseleave", hideTooltip);
    {
      tile.tabIndex = 0;
      tile.setAttribute("role", "button");
      tile.title = languageNames(item.node).join(", ");
      tile.setAttribute("aria-label", (item.direct ? item.node.owner.path + ": Files in this folder" : item.node.path) + ", " + formatNumber(item.node.lines) + (item.direct ? " lines. Enter to inspect files." : " lines. Enter to inspect; Shift Enter to explore."));
      tile.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          if (event.shiftKey && !item.direct) focusOn(item.node); else selectNode(item.node);
        }
      });
      visibleTiles.set(tileKey(item.node), tile);
      tile.addEventListener("click", event => {
        event.stopPropagation();
        selectNode(item.node);
      });
      tile.addEventListener("dblclick", event => {
        event.stopPropagation();
        if (!item.direct) focusOn(item.node);
      });
    }
    map.appendChild(tile);
    return tile;
  }

  function renderChildren(node, box, depth, inheritedHue) {
    if (depth >= Number(document.getElementById("depth").value) || box.w < 30 || box.h < 24) return;
    const layouts = squarify(childItems(node), box);
    layouts.forEach(item => {
      const hue = depth === 0 && !item.direct ? branchHue(item.node) : inheritedHue;
      const tile = makeTile(item, item.box, depth, hue);
      const hasContents = !item.direct && item.node.children.length > 0;
      const minimumWidth = depth === 0 ? 130 : 155;
      const minimumHeight = depth === 0 ? 82 : 96;
      const hasUsefulInterior = item.box.w >= minimumWidth &&
        item.box.h >= minimumHeight &&
        item.box.w * item.box.h >= 16000;
      if (hasContents && hasUsefulInterior && depth + 1 < Number(document.getElementById("depth").value)) {
        tile.classList.add("parent");
        const inset = 5;
        const header = showTileLanguages(item.node, item.box) ? 68 : 44;
        const inner = {
          x: item.box.x + inset,
          y: item.box.y + header,
          w: Math.max(0, item.box.w - inset * 2),
          h: Math.max(0, item.box.h - header - inset)
        };
        renderChildren(item.node, inner, depth + 1, hue);
      }
    });
  }

  function showTooltip(event, node) {
    tooltip.innerHTML = '<strong>' + escapeHTML(node.owner ? "Files in this folder" : node.path) + '</strong><br>' + compact(node.lines) + ' lines · ' + formatNumber(node.files) + ' files' + (languageNames(node).length ? '<br>' + escapeHTML(languageNames(node).join(' · ')) : '');
    tooltip.style.display = "block";
    const left = Math.min(window.innerWidth - tooltip.offsetWidth - 10, event.clientX + 12);
    const top = Math.min(window.innerHeight - tooltip.offsetHeight - 10, event.clientY + 12);
    tooltip.style.left = Math.max(8, left) + "px";
    tooltip.style.top = Math.max(8, top) + "px";
  }
  function hideTooltip() { tooltip.style.display = "none"; }

  function fileListHTML(node, limit) {
    const files = (node.fileList || []).slice(0, limit);
    const heading = '<div class="section-title">Files in this folder <span class="substat">' + formatNumber(node.directFiles) + ' direct files · Largest first</span></div>';
    if (!Array.isArray(node.fileList)) return heading + '<p class="file-count">File names aren’t available in this saved map. Regenerate it to include file details.</p>';
    const rows = files.map(file => '<div class="file-row"><span class="file-name">' + escapeHTML(file.name) + '</span><span class="stat-value">' + formatNumber(file.lines) + ' lines</span></div>').join("");
    return heading + rows + '<p class="file-count">Showing ' + formatNumber(files.length) + ' of ' + formatNumber(node.directFiles) + ' files</p>' +
      (node.fileList.length > 20 ? '<button type="button" class="control file-more">' + (limit === 20 ? 'Show more (up to 50)' : 'Show fewer') + '</button>' : '');
  }
  function renderFileList(host, node, limit = 20) {
    host.innerHTML = fileListHTML(node, limit);
    host.querySelector(".file-more")?.addEventListener("click", () => {
      renderFileList(host, node, limit === 20 ? 50 : 20);
      host.querySelector(".file-more")?.focus({preventScroll:true});
    });
  }
  function languageStyle(name) {
    // Muted language identities; folder colors remain independent.
    const hues = {
      Go:185, Java:25, Kotlin:275, JavaScript:48, TypeScript:215,
      Python:205, Rust:18, C:225, "C++":240, "C/C++":232, "C#":285,
      Swift:15, "Objective-C":210, "Objective-C++":230,
      Ruby:350, PHP:250, Dart:190, Scala:355, Shell:140,
      SQL:40, HTML:12, CSS:260, SCSS:325, Sass:325,
      Vue:155, Svelte:20, Markdown:210, Lua:235, R:220,
      Perl:195, Elixir:280, Erlang:335, Haskell:270,
      Clojure:135, ClojureScript:150, Groovy:200,
      "F#":200, "Visual Basic":255, Zig:40, Solidity:220,
      Terraform:265, "Protocol Buffers":165
    };
    const known = Object.prototype.hasOwnProperty.call(hues, name);
    return '--language-hue:' + (known ? hues[name] : 160) + ';--language-saturation:' + (known ? '36%' : '0%');
  }
  function languageChips(node) {
    const names = languageNames(node);
    return '<span class="tile-languages">' + names.slice(0, 2).map(name =>
      '<span class="language-chip" style="' + languageStyle(name) + '">' + escapeHTML(name) + '</span>'
    ).join("") + (names.length > 2 ? '<span class="language-more">+' + (names.length - 2) + '</span>' : '') + '</span>';
  }
  function languageBar(name, lines, total) {
    const width = total ? Math.max(0, Math.min(100, lines / total * 100)) : 0;
    return '<div class="bar" aria-hidden="true"><span style="' + languageStyle(name) + ';width:' + width + '%"></span></div>';
  }
  function directLanguageRows(node) {
    return languageNames(node).map(name => '<div class="stat-row"><div class="stat-heading"><span>' + escapeHTML(name) + '</span><span class="stat-value">' + formatNumber(node.languages[name].lines) + ' lines</span></div>' + languageBar(name, node.languages[name].lines, node.lines) + '</div>').join("");
  }
  function shareHTML(node) {
    return '<p class="share">' + percent(node.lines, root.lines) + ' of project lines' +
      (focus !== root ? '<br>' + percent(node.lines, focus.lines) + ' of lines in the current view' : '') + '</p>';
  }
  function renderDetails() {
    if (selected.owner) {
      const owner = selected.owner;
      details.innerHTML = '<div class="eyebrow">Selected files</div><h2>Files in this folder</h2><div class="folder-path">' + escapeHTML(owner.path === "." ? owner.name : owner.path) + '</div><div class="summary"><div><strong>' + formatNumber(owner.directLines) + '</strong>nonblank lines</div><div><strong>' + formatNumber(owner.directFiles) + '</strong>recognized files</div></div><div class="file-list"></div><button class="focus-button">Explore containing folder →</button>';
      renderFileList(details.querySelector(".file-list"), owner);
      details.querySelector(".file-list").insertAdjacentHTML("beforebegin", '<div class="section-title">Languages</div>' + directLanguageRows(selected));
      details.querySelector(".focus-button").addEventListener("click", () => focusOn(owner));
      details.querySelector(".summary").insertAdjacentHTML("afterend", shareHTML(selected));
      return;
    }
    const languages = Object.entries(selected.languages || {}).sort((a, b) => b[1].lines - a[1].lines || a[0].localeCompare(b[0]));
    const children = selected.children.slice().sort((a, b) => b.lines - a.lines);
    const languageRows = languages.map(([name, stat]) =>
      '<div class="stat-row"><div class="stat-heading"><span>' + escapeHTML(name) + '</span><span class="stat-value">' + formatNumber(stat.lines) + ' <span class="substat">' + formatNumber(stat.files) + ' files · ' + percent(stat.lines, selected.lines) + '</span></span></div>' + languageBar(name, stat.lines, selected.lines) + '</div>'
    ).join("") || '<div class="empty">No recognized source</div>';
    const childRows = children.map(child =>
      '<button class="child-row" data-path="' + escapeHTML(child.path) + '" title="Explore ' + escapeHTML(child.path) + '"><span class="child-name">' + escapeHTML(child.name) + '<span class="substat">' + formatNumber(child.files) + ' files</span></span><span class="child-value">' + compact(child.lines) + ' <span aria-hidden="true">→</span></span></button>'
    ).join("") || '<div class="empty">No subfolders with nonblank source lines.</div>';
    details.innerHTML =
      '<div class="eyebrow">Folder details</div><h2>' + escapeHTML(selected.name) + '</h2><div class="folder-path">' + escapeHTML(selected.path) + '</div>' +
      '<div class="summary"><div><strong>' + formatNumber(selected.lines) + '</strong>nonblank lines</div><div><strong>' + formatNumber(selected.files) + '</strong>recognized files</div></div>' +
      shareHTML(selected) +
      '<button class="focus-button" ' + (selected.path === focus.path ? "disabled" : "") + '>' + (selected.path === focus.path ? 'Viewing this folder' : 'Explore folder →') + '</button>' +
      '<div class="section-title">Languages <span class="substat">Nonblank lines by language</span></div><div class="language-list">' + languageRows + '</div>' +
      '<div class="section-title">Subfolders <span class="substat">Largest first · Select to explore</span></div><div class="child-list">' + childRows + '</div>' +
      (selected.directFiles ? '<div class="file-list"></div>' : '');
    if (selected.directFiles) renderFileList(details.querySelector(".file-list"), selected);
    details.querySelector(".focus-button").addEventListener("click", () => focusOn(selected));
    details.querySelectorAll(".child-row").forEach(row => row.addEventListener("click", () => focusOn(byPath.get(row.dataset.path))));
  }
  function percent(value, total) { return (total ? value / total * 100 : 0).toLocaleString(undefined, {maximumFractionDigits:1}) + "%"; }

  function selectNode(node) {
    selected = node;
    visibleTiles.forEach(tile => tile.classList.remove("selected"));
    const tile = visibleTiles.get(tileKey(node));
    if (tile) tile.classList.add("selected");
    renderDetails();
  }

  function ancestry(node) {
    const result = [node];
    while (parents.has(result[0].path)) result.unshift(parents.get(result[0].path));
    return result;
  }
  function renderCrumbs() {
    const chain = ancestry(focus);
    crumbs.innerHTML = "";
    chain.forEach((node, index) => {
      if (index) {
        const sep = document.createElement("span");
        sep.className = "sep";
        sep.textContent = "/";
        crumbs.appendChild(sep);
      }
      const button = document.createElement("button");
      button.className = "crumb";
      button.textContent = node.name;
      button.title = node.path;
      if (node === focus) button.setAttribute("aria-current", "location");
      button.addEventListener("click", () => focusOn(node));
      crumbs.appendChild(button);
    });
  }

  function focusOn(node) {
    focus = node;
    selected = node;
    details.scrollTop = 0;
    render();
    // Navigation replaces tiles and details controls. Keep keyboard users at
    // the destination folder rather than leaving focus on the document body.
    crumbs.querySelector('[aria-current="location"]')?.focus({preventScroll:true});
  }
  function render() {
    hideTooltip();
    map.innerHTML = "";
    visibleTiles.clear();
    const bounds = {x: 2, y: 2, w: Math.max(0, map.clientWidth - 4), h: Math.max(0, map.clientHeight - 4)};
    const isLeaf = focus.children.length === 0;
    document.getElementById("depth").disabled = isLeaf;
    document.querySelector(".map-caption").hidden = isLeaf;
    if (isLeaf && focus.files > 0) {
      map.innerHTML = '<div class="leaf-view"><div class="leaf-card"><div class="eyebrow">Folder summary</div><h2>' + escapeHTML(focus.name) + '</h2><div class="folder-path">' + escapeHTML(focus.path) + '</div><div class="summary"><div><strong>' + formatNumber(focus.lines) + '</strong>nonblank lines</div><div><strong>' + formatNumber(focus.files) + '</strong>recognized files</div></div><p>No subfolders with nonblank source lines. Totals include recognized files in subfolders; the list below shows only files directly in this folder.</p><div class="file-list"></div>' + (parents.has(focus.path) ? '<button class="control" id="leaf-back">↑ Back to ' + escapeHTML(parents.get(focus.path).name) + '</button>' : '') + '</div></div>';
      renderFileList(map.querySelector(".file-list"), focus);
      document.getElementById("leaf-back")?.addEventListener("click", () => focusOn(parents.get(focus.path)));
    } else {
      renderChildren(focus, bounds, 0, hueFor(focus.path));
    }
    if (!childItems(focus).length && !focus.files) {
      map.innerHTML = '<div class="empty" style="padding:20px">This folder has no visible child folders or direct source files.</div>';
    }
    document.getElementById("up").disabled = focus === root;
    document.getElementById("reset").disabled = focus === root;
    renderCrumbs();
    renderDetails();
  }

  const repositoryStats = document.getElementById("repository-stats");
  repositoryStats.innerHTML = '<span class="repository-loc"><strong>' + compactLOC(root.lines) + '</strong><span class="loc-unit">LOC</span></span><span class="repository-counts">' + formatNumber(root.files) + ' files · ' + formatNumber(byPath.size) + ' folders</span>';
  repositoryStats.title = formatNumber(root.lines) + " nonblank lines, including comments. Entire repository.";
  repositoryStats.setAttribute("aria-label", "Repository totals: " + formatNumber(root.lines) + " nonblank lines, including comments; " + formatNumber(root.files) + " files; " + formatNumber(byPath.size) + " folders.");
  document.getElementById("up").addEventListener("click", () => focusOn(parents.get(focus.path) || root));
  document.getElementById("reset").addEventListener("click", () => focusOn(root));
  document.getElementById("depth").addEventListener("change", render);
  const search = document.getElementById("search");
  const results = document.getElementById("search-results");
  function searchFolders() {
    const query = search.value.trim().toLowerCase();
    results.innerHTML = "";
    if (!query) return;
    const matches = Array.from(byPath.values()).filter(node => (node.path + " " + node.name).toLowerCase().includes(query)).sort((a,b) => b.lines - a.lines).slice(0, 20);
    matches.forEach(node => {
      const button = document.createElement("button");
      button.className = "search-result";
      button.innerHTML = escapeHTML(node.path === "." ? node.name : node.path) + '<small>' + formatNumber(node.lines) + ' lines · ' + formatNumber(node.files) + ' files</small>';
      button.addEventListener("click", () => { focusOn(node); results.innerHTML = ""; search.value = ""; search.focus(); });
      results.appendChild(button);
    });
    if (!matches.length) results.innerHTML = '<div class="empty" role="status">No folders found. Try a shorter name.</div>';
  }
  search.addEventListener("input", searchFolders);
  search.addEventListener("focus", searchFolders);
  search.addEventListener("keydown", event => {
    if (event.key === "ArrowDown") { event.preventDefault(); results.querySelector("button")?.focus(); }
    if (event.key === "Enter") results.querySelector("button")?.click();
  });
  document.addEventListener("keydown", event => { if (event.key === "Escape") { results.innerHTML = ""; hideTooltip(); } });
  document.addEventListener("click", event => { if (!event.target.closest(".search")) results.innerHTML = ""; });
  map.addEventListener("click", () => selectNode(focus));
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 80);
  });
  render();
})();
</script>
</body>
</html>
